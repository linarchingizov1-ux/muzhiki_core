name: muzhiki_support
description: Support chat module for Muzhiki apps.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  muzhiki_dependencies:
    path: ../muzhiki_dependencies
  muzhiki_ui:
    path: ../muzhiki_ui
  muzhiki_bridge:
    path: ../muzhiki_bridge
  cached_network_image: ^3.4.1
  camera: ^0.12.0+1
  crypto: ^3.0.7
  dio: ^5.10.0
  file_picker: ^8.3.3
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  flutter_image_compress: ^2.4.0
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  image_picker: ^1.2.2
  intl: ^0.20.2
  json_annotation: ^4.12.0
  open_filex: ^4.7.0
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  shimmer: ^3.0.0
  skeletonizer: ^2.1.3
  talker: ^5.1.17
  uuid: ^4.5.3
  video_compress: ^3.1.4
  video_player: ^2.11.1
  video_thumbnail: ^0.5.6
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.0

flutter:
  assets:
    - assets/svg/
    - assets/png/
