name: muzhiki_ui
description: Shared UI kit for Muzhiki apps.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  go_router: ^17.3.0
  photo_view: ^0.15.0
  skeletonizer: ^2.1.3
  soft_edge_blur: ^0.1.3
  video_player: ^2.11.1

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: lib/fonts/Inter/Inter.ttf
    - family: Manrope
      fonts:
        - asset: lib/fonts/Manrope/Manrope-ExtraLight.ttf
          weight: 200
        - asset: lib/fonts/Manrope/Manrope-Light.ttf
          weight: 300
        - asset: lib/fonts/Manrope/Manrope-Regular.ttf
          weight: 400
        - asset: lib/fonts/Manrope/Manrope-Medium.ttf
          weight: 500
        - asset: lib/fonts/Manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: lib/fonts/Manrope/Manrope-Bold.ttf
          weight: 700
        - asset: lib/fonts/Manrope/Manrope-ExtraBold.ttf
          weight: 800
