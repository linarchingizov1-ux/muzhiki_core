name: muzhiki_dependencies
description: Network, session and shared infrastructure for Muzhiki apps.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  muzhiki_ui:
    path: ../muzhiki_ui
  flutter_appauth:
    path: ../flutter_appauth
  app_links: ^7.1.2
  connectivity_plus: ^7.2.0
  cookie_jar: ^4.0.9
  crypto: ^3.0.7
  device_info_plus: ^12.4.0
  dio: ^5.10.0
  dio_cache_interceptor: ^4.0.6
  dio_cookie_manager: ^3.4.0
  flutter_animate: ^4.5.2
  flutter_custom_tabs: ^2.5.0
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.3.0
  flutter_screenutil: ^5.9.3
  flutter_timezone: ^5.1.0
  freezed_annotation: ^3.1.0
  fresh_dio: ^0.6.0
  go_router: ^17.3.0
  http_cache_hive_store: ^5.1.0
  json_annotation: ^4.12.0
  package_info_plus: ^9.0.1
  path: ^1.9.1
  path_provider: ^2.1.6
  screen_corner_radius: ^3.0.0
  shared_preferences: ^2.5.5
  talker: ^5.1.17
  talker_dio_logger: ^5.1.17
  uuid: ^4.5.3
  vpn_detector: ^1.3.1
  android_id: ^0.5.2+1

dev_dependencies:
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.0

flutter:
  assets:
    - assets/network_problem/svg/
  plugin:
    platforms:
      android:
        package: pro.muzhiki.muzhiki_core
        pluginClass: NetworkInfoPlugin
