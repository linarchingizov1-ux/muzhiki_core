version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  muzhiki_dependencies:
    path: ../muzhiki_dependencies
  muzhiki_ui:
    path: ../muzhiki_ui
  muzhiki_support:
    path: ../muzhiki_support
  dio: ^5.10.0
  flutter_animate: ^4.5.2
  flutter_image_compress: ^2.4.0
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  flutter_timezone: ^5.1.0
  go_router: ^17.3.0
  image_picker: ^1.2.2
  path: ^1.9.1
  provider: ^6.1.5+1
  shake: ^3.0.0
  talker: ^5.1.17
  vibration: ^3.2.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/report_problem/svg/
    - assets/svg/
