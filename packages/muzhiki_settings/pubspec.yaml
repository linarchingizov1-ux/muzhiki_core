name: muzhiki_settings
description: Notification settings module for Muzhiki apps.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  muzhiki_dependencies:
    path: ../muzhiki_dependencies
  muzhiki_ui:
    path: ../muzhiki_ui
  cached_network_image: ^3.4.1
  dio: ^5.10.0
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  go_router: ^17.3.0
  json_annotation: ^4.12.0
  provider: ^6.1.5+1
  skeletonizer: ^2.1.3

dev_dependencies:
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  json_serializable: ^6.14.0

flutter:
  assets:
    - assets/svg/
